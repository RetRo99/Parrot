project_id = "storyteller-kmp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# No per-file size cap (decision #6): the quota in cloud_user_storage is the
# enforced bound. Local dev should behave like the Pro plan (500 GB/file).

[functions.delete-cloud-account]
verify_jwt = true

[functions.generate-recap]
verify_jwt = true
