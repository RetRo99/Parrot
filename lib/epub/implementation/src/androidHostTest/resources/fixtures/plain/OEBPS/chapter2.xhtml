  <h1>Chapter 2</h1>
  <p id="p3">&#8220;My dear Mr.&nbsp;Bennet,&#8221; said his lady to him one day, &#8220;have
     you heard that Netherfield Park is let at last?&#8221;</p>
  <p id="p4">Mr. Bennet replied that he <em>had not</em>.</p>
